<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Whatever they said</title>
<link rel="stylesheet" href="shared.css">
<style>
  .hd { left: 0; top: 0; width: 1080px; height: 150px; display: flex; align-items: center; padding: 0 64px; background: var(--paper); z-index: 5; }
  .hd img { height: 58px; }
  .band { left: 0; top: 150px; width: 1080px; height: 900px; overflow: hidden; }
  .band img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .said { left: 72px; top: 214px; padding: 10px 16px; font: 600 40px/1 Puff; z-index: 3; }
  .quote { left: 56px; top: 290px; width: 968px; padding: 34px 40px 40px; font: 400 70px/1.12 Dela; letter-spacing: -0.01em; z-index: 3; }
  .quote .w { display: inline-block; }
  .arrow { left: 150px; top: 0; width: 189px; height: 180px; z-index: 3; }
  .found { left: 350px; top: 0; padding: 14px 22px; font-size: 46px; line-height: 1; z-index: 3; }
  .card { left: 56px; top: 0; width: 968px; padding: 46px 44px 44px; z-index: 3; }
  .card h2 { font: 400 88px/1 Dela; letter-spacing: -0.01em; }
  .meta { margin-top: 26px; display: flex; gap: 22px; align-items: center; font: 700 34px/1 Atk; }
  .meta .mono { font-size: 34px; }
  .line { left: 72px; top: 1200px; width: 940px; font: 400 76px/1.05 Dela; letter-spacing: -0.01em; }
  .line small { display: block; margin-top: 26px; font: 700 42px/1.35 Atk; letter-spacing: 0; }

  .end-art { left: 0; top: 150px; width: 1080px; }
  .end-art img { width: 100%; display: block; }
  .end-head { left: 40px; top: 860px; padding: 34px 44px 40px; font: 400 104px/0.98 Dela; letter-spacing: -0.01em; z-index: 4; }
  .end-lead { left: 72px; top: 1320px; width: 900px; font: 700 42px/1.35 Atk; }
  .end-btn { left: 72px; top: 1490px; padding: 34px 54px; background: var(--ink); color: var(--paper); font: 400 50px/1 Dela; }
  .end-cline { left: 66px; top: 1410px; width: 760px; height: 22px; }
  .credit { right: 48px; bottom: 44px; font: 400 26px/1 Atk; color: var(--muted); z-index: 6; }
</style>
</head>
<body>
<div id="stage">
  <div class="abs band" id="band">
    <img data-art="swirl" src="../../brand/babbling-banks-brand-v1.5/assets/art/swirl-01-1600.jpg" style="object-position:35% 40%" alt="">
    <img data-art="ripple" src="../../brand/babbling-banks-brand-v1.5/assets/art/ripple-01-1600.jpg" style="object-position:40% 15%" alt="">
    <img data-art="finger" src="../../brand/babbling-banks-brand-v1.5/assets/art/finger-01-1600.jpg" style="object-position:40% 35%" alt="">
    <img data-art="smear" src="../../brand/babbling-banks-brand-v1.5/assets/art/smear-01-1600.jpg" style="object-position:50% 45%" alt="">
  </div>
  <div class="abs end-art" id="endArt"><img src="../../brand/babbling-banks-brand-v1.5/assets/art/tape-resist-01-1600.jpg" alt=""></div>
  <div class="abs hd"><img src="../../brand/babbling-banks-brand-v1.5/assets/logo/wordmark.svg" alt="babbling banks"></div>

  <p class="abs tape said" id="said">what they said</p>
  <div class="abs tape quote" id="quote"></div>
  <img class="abs arrow" id="arrow" src="../../brand/babbling-banks-brand-v1.5/assets/art/crayon-arrow-ink.png" alt="">
  <p class="abs found" id="found">found it</p>
  <div class="abs tape card" id="card"><h2 id="title"></h2><div class="meta" id="meta"></div></div>

  <p class="abs line" id="line1">You don’t need the title.<small>Just their words. Mumbles, sound effects, all of it.</small></p>
  <p class="abs line" id="line2">Over 1,000 episodes.<small>Ten shows they actually watch, and counting.</small></p>

  <p class="abs tape end-head" id="endHead">Find it from<br>whatever they said.</p>
  <p class="abs end-lead" id="endLead">Type it or say it. We’ll find the episode.</p>
  <span class="abs cline end-cline" id="endLine"></span>
  <p class="abs end-btn" id="endBtn">Find it at babblingbanks.com</p>

  <p class="abs credit" id="credit"></p>
</div>

<script type="module">
import { prog, lerp, ease, set, swipe, drawArrow, boot, $, $$ } from './engine.js';

// Real decodes from the app's own search (src/lib/search.js), top result each time.
const DECODES = [
  { at: 0.3, end: 6.6, q: 'the one where the dog freezes dad', m: ['dog', 'freezes', 'dad'], title: 'Magic Xylophone', show: 'Bluey', code: 'S1E01', where: 'Disney+', art: 'swirl', piece: 'Mint and Blue', slow: true },
  { at: 6.6, end: 9.5, q: 'the monkey on the bike', m: ['monkey', 'bike'], title: 'Curious George Rides a Bike', show: 'Curious George', code: 'S1E26b', where: 'Hulu', art: 'ripple', piece: 'Aqua Wash' },
  { at: 9.5, end: 12.4, q: 'the pig jumps in muddy puddles', m: ['pig', 'jumps', 'muddy'], title: 'Muddy Puddles', show: 'Peppa Pig', code: 'S1E01', where: 'Paramount+', art: 'finger', piece: 'Garden Colors' },
  { at: 12.4, end: 15.4, q: 'the garbage truck at the beach', m: ['garbage', 'truck', 'beach'], title: 'Beach Day', show: 'Trash Truck', code: 'S2E07', where: 'Netflix', art: 'smear', piece: 'Blue and Umber' },
];
const END = 15.4;

function quoteHTML(d) {
  const words = d.q.split(' ');
  let k = 0;
  return '“' + words.map((w, i) => {
    let inner = w;
    if (d.m.includes(w)) inner = `<span class="sw${k++ % 2 ? ' b' : ''}"><i></i>${w}</span>`;
    const last = i === words.length - 1;
    return `<span class="w${last ? ' nw' : ''}">${inner}${last ? '”' : ''}</span>`;
  }).join(' ');
}

let shown = -1;
function render(t) {
  const i = Math.max(0, DECODES.findLastIndex((d) => t >= d.at));
  const d = DECODES[i];
  if (i !== shown) {
    shown = i;
    $('#quote').innerHTML = quoteHTML(d);
    $('#title').textContent = d.title;
    $('#meta').innerHTML = `<span class="show">${d.show}</span><span class="mono">${d.code}</span><span>· ${d.where}</span>`;
  }
  const lt = t - d.at;            // time into this decode
  const dur = d.end - d.at;
  const slow = !!d.slow;
  const words = $$('#quote .w');
  const per = slow ? 0.24 : 0.06, q0 = slow ? 0.3 : 0.15;
  const tq = prog(lt, 0, 0.45, ease.back);
  const exit = i === DECODES.length - 1 ? prog(t, END - 0.5, END, ease.inOut) : prog(lt, dur - 0.35, dur, ease.inOut);
  const enterX = i === 0 ? 0 : lerp(1100, 0, prog(lt, 0, 0.45, ease.out));

  // Band: crossfade to this decode's piece; hold through the exit.
  $$('#band img').forEach((img) => {
    const prev = DECODES[i - 1];
    img.style.opacity = img.dataset.art === d.art ? (i === 0 ? 1 : prog(lt, 0, 0.4)) : prev && img.dataset.art === prev.art ? 1 : 0;
    img.style.zIndex = img.dataset.art === d.art ? 2 : 1;
  });
  $('#band').style.opacity = 1 - prog(t, END - 0.2, END + 0.4);

  set($('#said'), { x: i === 0 ? lerp(-40, 0, prog(t, 0.1, 0.5)) : 0, o: (i === 0 ? prog(t, 0.1, 0.5) : 1) * (1 - prog(t, END - 0.5, END)) });
  const quote = $('#quote');
  set(quote, { x: enterX - exit * 1100, y: i === 0 ? lerp(-40, 0, tq) : 0, r: lerp(-5, -2, tq), o: i === 0 ? Math.min(1, tq * 3) : 1 });
  words.forEach((w, k) => { const p = prog(lt, q0 + k * per, q0 + k * per + 0.18, ease.back); w.style.opacity = Math.min(1, p * 2); w.style.transform = `translateY(${lerp(18, 0, p)}px)`; });
  const sw0 = q0 + words.length * per + (slow ? 0.2 : 0.05);
  $$('#quote .sw').forEach((el, k) => swipe(el, prog(lt, sw0 + k * (slow ? 0.3 : 0.14), sw0 + k * (slow ? 0.3 : 0.14) + 0.3)));
  const nSw = $$('#quote .sw').length;
  const a0 = sw0 + nSw * (slow ? 0.3 : 0.14) + (slow ? 0.25 : 0.1);

  // Arrow, "found it", card sit just under the quote strip.
  const qb = 290 + quote.offsetHeight;
  const arrow = $('#arrow');
  arrow.style.top = qb + 6 + 'px';
  drawArrow(arrow, prog(lt, a0, a0 + 0.4, ease.inOut) * (1 - exit));
  const f = prog(lt, a0 + 0.4, a0 + 0.7, ease.back);
  $('#found').style.top = qb + 70 + 'px';
  set($('#found'), { r: -4, s: f * (1 - exit), o: f > 0 ? 1 : 0 });
  const c = prog(lt, a0 + 0.55, a0 + 1.05, ease.back);
  const card = $('#card');
  card.style.top = qb + 200 + 'px';
  set(card, { x: -exit * 1100, y: lerp(120, 0, c), r: lerp(4, 1, c), o: Math.min(1, c * 2) });

  // Lines on paper below.
  const l1 = prog(t, 4.6, 5.2) * (1 - prog(t, 7.6, 8.0));
  set($('#line1'), { y: lerp(30, 0, prog(t, 4.6, 5.2)), o: l1 });
  const l2 = prog(t, 8.2, 8.8) * (1 - prog(t, END - 0.5, END));
  set($('#line2'), { y: lerp(30, 0, prog(t, 8.2, 8.8)), o: l2 });

  // End: Blue and Yellow hung whole, the headline strip, the CTA.
  const ea = prog(t, END, END + 0.7), eh = prog(t, END + 0.5, END + 1.2, ease.back), el = prog(t, END + 1.3, END + 1.9);
  const eb = prog(t, END + 2.2, END + 2.8, ease.back);
  set($('#endArt'), { y: lerp(40, 0, ea), o: ea });
  set($('#endHead'), { x: lerp(-90, 0, eh), r: -2.5, o: Math.min(1, eh * 2) });
  set($('#endLead'), { y: lerp(24, 0, el), o: el });
  $('#endLine').style.clipPath = `inset(0 ${(1 - prog(t, END + 1.8, END + 2.4)) * 100}% 0 0)`;
  set($('#endBtn'), { y: lerp(50, 0, eb), r: eb > 0.98 && t > END + 6 && t < END + 6.25 ? 0 : 1.5, o: Math.min(1, eb * 2) });

  $('#credit').textContent = t < END ? `Art by Banks · ${d.piece}` : 'Art by Banks · Blue and Yellow';
}

const sfx = [];
for (const d of DECODES) {
  const n = d.q.split(' ').length, per = d.slow ? 0.24 : 0.06, q0 = d.slow ? 0.3 : 0.15;
  if (d !== DECODES[0]) sfx.push({ t: d.at, kind: 'whoosh' });
  sfx.push({ t: d.at + 0.05, kind: 'tape' });
  if (d.slow) for (let k = 0; k < n; k++) sfx.push({ t: d.at + q0 + k * per, kind: 'key' });
  const sw0 = q0 + n * per + (d.slow ? 0.2 : 0.05), step = d.slow ? 0.3 : 0.14;
  d.m.forEach((_, k) => sfx.push({ t: d.at + sw0 + k * step, kind: 'crayon' }));
  const a0 = sw0 + d.m.length * step + (d.slow ? 0.25 : 0.1);
  sfx.push({ t: d.at + a0 + 0.4, kind: 'pop' }, { t: d.at + a0 + 0.6, kind: 'tape' });
}
sfx.push({ t: END, kind: 'whoosh' }, { t: END + 0.5, kind: 'tape' }, { t: END + 2.2, kind: 'tape' }, { t: END + 6, kind: 'tap' });

boot({ width: 1080, height: 1920, duration: 24, render, sfx });
</script>
</body>
</html>
