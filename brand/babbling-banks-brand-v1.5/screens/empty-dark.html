<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../assets/logo/mark-app-icon.svg" type="image/svg+xml">
<title>No match · Babbling Banks</title>
<style>
  @font-face { font-family: "DynaPuff"; src: url("../assets/fonts/DynaPuff-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Dela Gothic One"; src: url("../assets/fonts/DelaGothicOne-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Atkinson Hyperlegible Next"; src: url("../assets/fonts/AtkinsonHyperlegibleNext-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Atkinson Hyperlegible Next"; src: url("../assets/fonts/AtkinsonHyperlegibleNext-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url("../assets/fonts/IBMPlexMono-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }

  :root {
    color-scheme: light; /* Light only in v1 */
    --ink: #1D1C1F;
    --on-ink: #F5F6F2;
    --paper: #F5F6F2;
    --tape: #FFFFFF;
    --sunk: #E8EAE4;
    --muted: #5E615A;
    --cobalt: #3550B8;
    --lemon: #EEE45E;
    --f-playful: "DynaPuff", "Arial Rounded MT Bold", sans-serif;
    --f-dela: "Dela Gothic One", "Arial Black", sans-serif;
    --f-body: "Atkinson Hyperlegible Next", Verdana, sans-serif;
    --gutter: 18px;
    --col: 560px;
  }
  @media (min-width: 600px) { :root { --gutter: 48px; } }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 400 16px/1.5 var(--f-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .icon { width: 24px; height: 24px; fill: var(--ink); display: block; flex: none; }

  /* Header */
  .header {
    position: relative; z-index: 2;
    height: 56px; background: var(--paper);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 calc(var(--gutter) - 12px) 0 var(--gutter);
  }
  .wordmark img { display: block; height: 24px; width: auto; }
  .tap { width: 48px; height: 48px; display: grid; place-items: center; color: var(--ink); text-decoration: none; }

  /* Art band: 430px behind the top of results, mirrored, focus 62% 50% */
  main { position: relative; flex: 1; }
  .art-band { position: absolute; inset: 0 0 auto 0; height: 430px; overflow: hidden; z-index: 0; }
  .art-band img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; display: block; }

  .col { position: relative; z-index: 1; width: calc(100% - 2 * var(--gutter)); max-width: var(--col); margin-left: var(--gutter); padding-top: 132px; }

  .tape { background: var(--tape); padding: 16px 18px; }

  /* Quote strip (-2deg), no matched words so no lemon swipe */
  .quote-strip { padding: 16px; transform: rotate(-2deg); }
  .quote-strip p { margin: 0; font: 400 26px/1.15 var(--f-dela); letter-spacing: -0.01em; }
  .nowrap { white-space: nowrap; }
  .quote-meta { display: block; margin-top: 10px; font: 700 13px/1.3 var(--f-body); color: var(--muted); }

  /* Empty state: straight tape strip */
  .empty { margin-top: 40px; padding: 22px 18px 14px; }
  .empty h1 { font: 400 20px/1.1 var(--f-dela); margin: 0 0 8px; }
  .empty p { margin: 0; font: 400 16px/1.5 var(--f-body); }
  .section-label { font: 600 18px/1.1 var(--f-playful); color: var(--ink); margin: 24px 0 4px; }
  .examples { list-style: none; margin: 0; padding: 0; }
  .examples a {
    display: flex; align-items: center; min-height: 44px;
    font: 700 17px/1.25 var(--f-body); color: var(--cobalt); text-decoration: none;
  }
  .examples a:hover { text-decoration: underline; text-underline-offset: 4px; }

  .btn-secondary {
    display: inline-flex; align-items: center; min-height: 48px; margin-top: 24px;
    padding: 12px 18px; background: var(--tape); color: var(--ink);
    font: 700 17px/1.25 var(--f-body); border: 2px solid var(--ink); border-radius: 0; text-decoration: none;
  }

  /* Credit */
  .credit-row { padding: 48px 16px 12px; text-align: right; }
  .credit { font: 400 11px/1 var(--f-body); color: var(--muted); }
</style>

<style id="night">
:root{color-scheme:dark;--paper:#111613;--sunk:#1B211D;--ink:#EEF1EC;--on-ink:#111613;--muted:#9AA39C;--cobalt:#8FA6F2;--danger:#FF8A80}
body,.phone{background:#111613 !important;color:#EEF1EC}
.tape,.tape *{--ink:#1D1C1F;--muted:#5E615A;--cobalt:#3550B8;--sunk:#E8EAE4}
.tape{color:#1D1C1F}
[class*="cline"],.crayon-line,.cl{filter:brightness(1.6) saturate(.8)}
.btn,.btn-primary{background:#EEF1EC !important;color:#111613 !important}
.btn-secondary{color:#1D1C1F !important;border-color:#1D1C1F !important}
.arrowrow img,img[src*="crayon-arrow"]{filter:invert(1) brightness(.95)}
</style></head>
<body>

  </svg>

  <header class="header">
    <a class="wordmark" href="#home"><img src="../assets/logo/wordmark-reversed.svg" alt="babbling banks" width="136" height="24"></a>
    <a class="tap" href="#repeat-offenders" aria-label="Repeat offenders"><svg class="icon" aria-hidden="true"><use href="#i-heart"/></svg></a>
  </header>

  <main>
    <div class="art-band" aria-hidden="true">
      <img src="../assets/art/night-01-1600.jpg" alt="">
    </div>
    <div class="col">
      <div class="tape quote-strip">
        <p><span class="nowrap">&ldquo;the</span> purple one where they go <span class="nowrap">up&rdquo;</span></p>
        <span class="quote-meta">You searched</span>
      </div>

      <section class="tape empty" aria-labelledby="empty-title">
        <h1 id="empty-title">That one stumped us.</h1>
        <p>Try a character, a color, or a song they keep humming.</p>
        <h2 class="section-label">try one</h2>
        <ul class="examples">
          <li><a href="#q=the+bubble+bath+one">&ldquo;the bubble bath one&rdquo;</a></li>
          <li><a href="#q=the+moon+goes+beep">&ldquo;the moon goes beep&rdquo;</a></li>
          <li><a href="#q=the+yellow+truck+song">&ldquo;the yellow truck song&rdquo;</a></li>
        </ul>
      </section>

      <a class="btn-secondary" href="#edit">Say it another way</a>
    </div>
  </main>

  <footer class="credit-row"><span class="credit">Art by Banks · Emerald Texture</span></footer>
</body>
</html>
