<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>Share card · Babbling Banks</title>
<style>
  @font-face { font-family: "DynaPuff"; src: url("../assets/fonts/DynaPuff-600.woff2") format("woff2"); font-weight: 600; font-display: block; }
  @font-face { font-family: "Dela Gothic One"; src: url("../assets/fonts/DelaGothicOne-400.woff2") format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Atkinson Hyperlegible Next"; src: url("../assets/fonts/AtkinsonHyperlegibleNext-400.woff2") format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Atkinson Hyperlegible Next"; src: url("../assets/fonts/AtkinsonHyperlegibleNext-700.woff2") format("woff2"); font-weight: 700; font-display: block; }
  @font-face { font-family: "IBM Plex Mono"; src: url("../assets/fonts/IBMPlexMono-500.woff2") format("woff2"); font-weight: 500; font-display: block; }

  :root {
    --ink: #1D1C1F;
    --paper: #F5F6F2;
    --tape: #FFFFFF;
    --muted: #5E615A;
    --cobalt: #3550B8;
    --f-playful: "DynaPuff", "Arial Rounded MT Bold", sans-serif;
    --f-dela: "Dela Gothic One", "Arial Black", sans-serif;
    --f-body: "Atkinson Hyperlegible Next", Verdana, sans-serif;
    --f-mono: "IBM Plex Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); }
  .card {
    position: relative;
    width: 1200px; height: 630px; overflow: hidden;
    background: var(--paper); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* Art full-bleed on the left 46% (552px) */
  .art { position: absolute; left: 0; top: 0; bottom: 0; width: 46%; overflow: hidden; }
  .art img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; display: block; }

  /* Right side: 648px, 40px inner margins */
  .right { position: absolute; left: 46%; right: 0; top: 0; bottom: 0; padding: 40px 48px 0 40px; }

  .tape { background: var(--tape); }

  .quote-strip { padding: 18px 22px 20px; transform: rotate(-2deg); margin-left: -72px; }
  .quote-strip p { margin: 0; font: 400 40px/1.15 var(--f-dela); letter-spacing: -0.01em; }
  .nowrap { white-space: nowrap; }
  .match { position: relative; isolation: isolate; display: inline-block; }
  .match::before {
    content: ""; position: absolute; z-index: -1;
    left: -0.18em; right: -0.18em; top: 0.12em; bottom: -0.08em;
    background: url("../assets/art/crayon-swipe-lemon.png") center / 100% 100% no-repeat;
  }
  .match.alt::before { background-image: url("../assets/art/crayon-swipe-lemon-2.png"); }

  .arrow-row { position: relative; height: 84px; }
  .arrow-row img { position: absolute; left: 34px; top: 0; width: 86px; height: 82px; }
  .found {
    position: absolute; left: 132px; top: 34px;
    background: var(--tape); padding: 7px 10px;
    font: 600 18px/1.1 var(--f-playful); color: var(--cobalt);
    transform: rotate(-4deg);
  }

  .result-strip { padding: 22px 22px 18px; transform: rotate(1deg); }
  .result-strip h1 { margin: 0; font: 400 56px/1.0 var(--f-dela); text-wrap: balance; }
  .caption-row { margin: 12px 0 0; display: flex; gap: 14px; align-items: baseline; }
  .show-name { font: 700 18px/1.3 var(--f-body); color: var(--cobalt); }
  .code { font: 500 18px/1.3 var(--f-mono); }

  .sign { position: absolute; right: 48px; bottom: 28px; text-align: right; }
  .sign img { display: block; width: 220px; height: auto; margin-left: auto; }
  .credit { display: block; margin-top: 10px; font: 400 16px/1 var(--f-body); color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="art"><img src="../assets/art/smear-01-1600.jpg" alt=""></div>
    <div class="right">
      <div class="tape quote-strip">
        <p><span class="nowrap">&ldquo;the</span> one with the <span class="match">monkey</span> and the <span class="nowrap"><span class="match alt">bike</span>&rdquo;</span></p>
      </div>
      <div class="arrow-row">
        <img src="../assets/art/crayon-arrow-ink.png" alt="">
        <span class="found">found it</span>
      </div>
      <div class="tape result-strip">
        <h1>Coco Learns to Ride</h1>
        <p class="caption-row"><span class="show-name">Coco &amp; Friends</span><span class="code">S2E14</span></p>
      </div>
    </div>
    <div class="sign">
      <img src="../assets/logo/wordmark.svg" alt="babbling banks">
      <span class="credit">Art by Banks · Blue and Umber</span>
    </div>
  </div>
</body>
</html>
