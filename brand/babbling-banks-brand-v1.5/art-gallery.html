<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Babbling Banks Art</title>
<link rel="stylesheet" href="colors_and_type.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--color-surface);color:var(--color-text);font:var(--text-body)}
main{max-width:1180px;margin:0 auto;padding:40px 24px 64px;position:relative}
header img{height:28px}h1{font:var(--text-display);margin:28px 0 8px}
.lead{font:var(--text-lead);max-width:560px;margin:0 0 36px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:36px 28px}
figure{margin:0}.frame{background:var(--color-surface-tape);padding:12px;transform:rotate(-1deg)}
figure:nth-child(2n) .frame{transform:rotate(1.2deg)}figure:nth-child(3n) .frame{transform:rotate(-.4deg)}
.frame img{display:block;width:100%;height:340px;object-fit:contain}
figcaption{margin-top:14px;display:flex;flex-direction:column;gap:3px}
figcaption b{font:var(--text-playful)}figcaption span{font:var(--text-caption);color:var(--color-text-muted)}
figcaption code{font:var(--text-code);color:var(--color-text-muted)}
.credit{position:absolute;right:24px;bottom:20px;font:var(--text-credit);color:var(--color-text-muted)}
@media (max-width:420px){main{padding:28px 18px 56px}}
</style></head><body><main>
<header><img src="assets/logo/wordmark.svg" alt="babbling banks"></header>
<h1>The collection</h1><p class="lead">Eleven of Banks' pieces, cleaned up from photos of the originals. Each screen gets its own; dark mode uses Emerald Texture everywhere. Fields may be cropped; objects are always shown whole.</p>
<div class="grid"><figure><div class="frame"><img src="assets/art/tape-resist-01-1600.jpg" alt="Crayon over masking tape, by Banks" loading="lazy"></div><figcaption><b>Home</b><span>Crayon over masking tape</span><code>tape-resist-01 · object</code></figcaption></figure><figure><div class="frame"><img src="assets/art/swirl-01-1600.jpg" alt="Mint and blue finger paint, by Banks" loading="lazy"></div><figcaption><b>Results</b><span>Mint and blue finger paint</span><code>swirl-01 · field</code></figcaption></figure><figure><div class="frame"><img src="assets/art/stars-01-1600.jpg" alt="Purple paint, foil star stickers, by Banks" loading="lazy"></div><figcaption><b>Empty results</b><span>Purple paint, foil star stickers</span><code>stars-01 · field</code></figcaption></figure><figure><div class="frame"><img src="assets/art/ripple-01-1600.jpg" alt="Aqua and green wash, by Banks" loading="lazy"></div><figcaption><b>Episode detail</b><span>Aqua and green wash</span><code>ripple-01 · field</code></figcaption></figure><figure><div class="frame"><img src="assets/art/smear-01-1600.jpg" alt="Thick blue, umber, gold and red, by Banks" loading="lazy"></div><figcaption><b>Share card</b><span>Thick blue, umber, gold and red</span><code>smear-01 · field</code></figcaption></figure><figure><div class="frame"><img src="assets/art/finger-01-1600.jpg" alt="Garden colors with red splats, by Banks" loading="lazy"></div><figcaption><b>Social post</b><span>Garden colors with red splats</span><code>finger-01 · field</code></figcaption></figure><figure><div class="frame"><img src="assets/art/night-01-1600.jpg" alt="Black and teal over emerald, by Banks" loading="lazy"></div><figcaption><b>Dark theme</b><span>Black and teal over emerald</span><code>night-01 · field</code></figcaption></figure><figure><div class="frame"><img src="assets/art/collage-01-1600.jpg" alt="Cut paper shapes and paint dots, by Banks" loading="lazy"></div><figcaption><b>Art page</b><span>Cut paper shapes and paint dots</span><code>collage-01 · object</code></figcaption></figure><figure><div class="frame"><img src="assets/art/scribble-01-1600.jpg" alt="Black and blue marker scribble, by Banks" loading="lazy"></div><figcaption><b>404</b><span>Black and blue marker scribble</span><code>scribble-01 · object</code></figcaption></figure><figure><div class="frame"><img src="assets/art/leaf-01-1600.jpg" alt="Green paint over a tape-resist leaf, by Banks" loading="lazy"></div><figcaption><b>Loading</b><span>Green paint over a tape-resist leaf</span><code>leaf-01 · object</code></figcaption></figure><figure><div class="frame"><img src="assets/art/cone-01-1600.jpg" alt="Stamped dots over brown and blue, by Banks" loading="lazy"></div><figcaption><b>Offline</b><span>Stamped dots over brown and blue</span><code>cone-01 · object</code></figcaption></figure></div>
<span class="credit">Art by Banks</span>
</main></body></html>
